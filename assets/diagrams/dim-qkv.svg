" stroke="#d7d0c4"/><text x="626.0" y="594.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="668" y="568" width="79" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="708.0" y="594.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">5</text><rect x="750" y="568" width="79" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="790.0" y="594.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><text x="176" y="647" fill="#1b1b1b" font-size="18" text-anchor="start" font-weight="normal">Q = Y[:,0:4]</text><text x="505" y="647" fill="#1b1b1b" font-size="18" text-anchor="start" font-weight="normal">K = Y[:,4:6]</text><text x="670" y="647" fill="#1b1b1b" font-size="18" text-anchor="start" font-weight="normal">V = Y[:,6:8]</text><text x="176" y="678" fill="#57534b" font-size="17" text-anchor="start" font-weight="normal">[3,4] → 12 个数</text><text x="505" y="678" fill="#57534b" font-size="17" text-anchor="start" font-weight="normal">[3,2] → 6 个数</text><text x="670" y="678" fill="#57534b" font-size="17" text-anchor="start" font-weight="normal">[3,2] → 6 个数</text><rect x="24" y="710" width="912" height="109" rx="6" fill="#f8efda" stroke="#d7d0c4"/><text x="42" y="741" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">投影会产生新值；split 只划定列范围</text><text x="42" y="772" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">本例 Q 宽 Hq·d=2×2=4，K/V 各宽 Hkv·d=1×2=2，不能均分成三份。</text><text x="42" y="801" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">PyTorch Linear.weight 存 [out,in]=[8,4]，forward 使用 X @ weight.T。</text><text x="42" y="863" fill="#57534b" font-size="17" text-anchor="start" font-weight="normal">模型实例需单独代入：Qwen3-0.6B 的 H=1024，Q/K/V 宽度为 2048 / 1024 / 1024。</text></g></svg>