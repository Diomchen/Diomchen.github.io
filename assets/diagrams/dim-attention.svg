<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 945" role="img" aria-labelledby="title desc"><title id="title">Attention 矩阵乘法：哪个轴保留，哪个轴被求和</title><desc id="desc">完整展示一个 head 的 Q、K转置、分数、因果softmax、V和输出，区分第一次沿d求和和第二次沿Tk求和，给出可复算数值。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a63a2a"/></marker></defs><rect width="960" height="945" fill="#fdfcf8"/><g font-family="Segoe UI,Microsoft YaHei,Noto Sans SC,sans-serif"><text x="24" y="38" fill="#1b1b1b" font-size="25" text-anchor="start" font-weight="600">Attention 矩阵乘法：哪个轴保留，哪个轴被求和</text><text x="24" y="72" fill="#57534b" font-size="17" text-anchor="start" font-weight="normal">只看一个 batch、一个 query head。Tq=Tk=3、d=dv=2；这里显式画出概念矩阵。</text><text x="42" y="126" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">① Q [Tq=3,d=2]</text><text x="105.5" y="156" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">d0</text><text x="168.5" y="156" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">d1</text><text x="62" y="194.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">q0</text><rect x="74" y="168" width="60" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="104.5" y="194.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="137" y="168" width="60" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="167.5" y="194.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><text x="62" y="234.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">q1</text><rect x="74" y="208" width="60" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="104.5" y="234.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="137" y="208" width="60" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="167.5" y="234.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><text x="62" y="274.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">q2</text><rect x="74" y="248" width="60" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="104.5" y="274.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="137" y="248" width="60" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="167.5" y="274.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><text x="253" y="229" fill="#1b1b1b" font-size="28" text-anchor="start" font-weight="normal">×</text><text x="312" y="126" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">Kᵀ [d=2,Tk=3]</text><text x="377.5" y="156" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">k0</text><text x="440.5" y="156" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">k1</text><text x="503.5" y="156" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">k2</text><text x="334" y="194.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">d0</text><rect x="346" y="168" width="60" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="376.5" y="194.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="409" y="168" width="60" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="439.5" y="194.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="472" y="168" width="60" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="502.5" y="194.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><text x="334" y="234.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">d1</text><rect x="346" y="208" width="60" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="376.5" y="234.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="409" y="208" width="60" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="439.5" y="234.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="472" y="208" width="60" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="502.5" y="234.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><text x="575" y="229" fill="#1b1b1b" font-size="28" text-anchor="start" font-weight="normal">=</text><text x="636" y="126" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">QKᵀ [Tq=3,Tk=3]</text><text x="711.5" y="156" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">k0</text><text x="774.5" y="156" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">k1</text><text x="837.5" y="156" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">k2</text><text x="668" y="194.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">q0</text><rect x="680" y="168" width="60" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="710.5" y="194.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="743" y="168" width="60" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="773.5" y="194.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="806" y="168" width="60" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="836.5" y="194.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><text x="668" y="234.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">q1</text><rect x="680" y="208" width="60" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="710.5" y="234.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="743" y="208" width="60" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="773.5" y="234.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="806" y="208" width="60" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="836.5" y="234.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><text x="668" y="274.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">q2</text><rect x="680" y="248" width="60" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="710.5" y="274.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="743" y="248" width="60" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="773.5" y="274.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="806" y="248" width="60" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="836.5" y="274.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">2</text><text x="42" y="331" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">对 d 求和：S[i,j] = Σᵣ Q[i,r]K[j,r]。Q 的位置 i 和 K 的位置 j 保留下来。</text><text x="42" y="360" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">除以 √2 → 加因果 mask → 沿 key 列做 softmax；形状仍为 [3,3]。</text><text x="42" y="435" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">② A [Tq=3,Tk=3]</text><text x="109.0" y="465" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">k0</text><text x="179.0" y="465" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">k1</text><text x="249.0" y="465" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">k2</text><text x="62" y="503.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">q0</text><rect x="74" y="477" width="67" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="108.0" y="503.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1.000</text><rect x="144" y="477" width="67" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="178.0" y="503.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0.000</text><rect x="214" y="477" width="67" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="248.0" y="503.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0.000</text><text x="62" y="543.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">q1</text><rect x="74" y="517" width="67" height="37" rx="3" fill="#f8efda" stroke="#a63a2a"/><rect x="76" y="519" width="63" height="33" rx="2" fill="none" stroke="#a63a2a" stroke-width="2"/><text x="108.0" y="543.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0.330</text><rect x="144" y="517" width="67" height="37" rx="3" fill="#f8efda" stroke="#a63a2a"/><rect x="146" y="519" width="63" height="33" rx="2" fill="none" stroke="#a63a2a" stroke-width="2"/><text x="178.0" y="543.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0.670</text><rect x="214" y="517" width="67" height="37" rx="3" fill="#f8efda" stroke="#a63a2a"/><rect x="216" y="519" width="63" height="33" rx="2" fill="none" stroke="#a63a2a" stroke-width="2"/><text x="248.0" y="543.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0.000</text><text x="62" y="583.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">q2</text><rect x="74" y="557" width="67" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="108.0" y="583.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0.248</text><rect x="144" y="557" width="67" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="178.0" y="583.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0.248</text><rect x="214" y="557" width="67" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="248.0" y="583.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0.503</text><text x="314" y="539" fill="#1b1b1b" font-size="28" text-anchor="start" font-weight="normal">×</text><text x="369" y="435" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">V [Tk=3,dv=2]</text><text x="440.5" y="465" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">v0</text><text x="507.5" y="465" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">v1</text><text x="395" y="503.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">k0</text><rect x="407" y="477" width="64" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="439.5" y="503.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="474" y="477" width="64" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="506.5" y="503.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">2</text><text x="395" y="543.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">k1</text><rect x="407" y="517" width="64" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="439.5" y="543.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3</text><rect x="474" y="517" width="64" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="506.5" y="543.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">4</text><text x="395" y="583.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">k2</text><rect x="407" y="557" width="64" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="439.5" y="583.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">5</text><rect x="474" y="557" width="64" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="506.5" y="583.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">6</text><text x="578" y="539" fill="#1b1b1b" font-size="28" text-anchor="start" font-weight="normal">=</text><text x="633" y="435" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">O [Tq=3,dv=2]</text><text x="727.5" y="465" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">v0</text><text x="818.5" y="465" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">v1</text><text x="670" y="503.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">q0</text><rect x="682" y="477" width="88" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="726.5" y="503.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1.000</text><rect x="773" y="477" width="88" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="817.5" y="503.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">2.000</text><text x="670" y="543.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">q1</text><rect x="682" y="517" width="88" height="37" rx="3" fill="#e6eff5" stroke="#a63a2a"/><rect x="684" y="519" width="84" height="33" rx="2" fill="none" stroke="#a63a2a" stroke-width="2"/><text x="726.5" y="543.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">2.340</text><rect x="773" y="517" width="88" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="817.5" y="543.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3.340</text><text x="670" y="583.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">q2</text><rect x="682" y="557" width="88" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="726.5" y="583.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3.510</text><rect x="773" y="557" width="88" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="817.5" y="583.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">4.510</text><text x="42" y="650" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">对 Tk 求和：O[i,c] = Σⱼ A[i,j]V[j,c]。保留 query 位置 i 和 value 分量 c。</text><text x="42" y="679" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">例如 O[1,0] ≈ 0.330×1 + 0.670×3 + 0×5 = 2.340。小数为显示近似。</text><rect x="24" y="716" width="912" height="109" rx="6" fill="#f8efda" stroke="#d7d0c4"/><text x="42" y="747" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">两次乘法，消失的是不同的轴</text><text x="42" y="778" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">QKᵀ： [3,2] × [2,3] → [3,3]，对 d 求和；Q/K 各 6 个输入数产生 9 个分数。</text><text x="42" y="807" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">AV：  [3,3] × [3,2] → [3,2]，对 Tk 求和；最后得到每个 query 的 2 个分量。</text><text x="42" y="865" fill="#57534b" font-size="17" text-anchor="start" font-weight="normal">按 Q head 选到对应 K（MHA 同头 / GQA 共享头）后，概念形状为：</text><text x="42" y="894" fill="#57534b" font-size="17" text-anchor="start" font-weight="normal">[B,Hq,Tq,d] × [B,Hq,d,Tk] → [B,Hq,Tq,Tk]；不要求物理复制 K。</text></g></svg>