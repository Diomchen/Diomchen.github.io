<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 880" role="img" aria-labelledby="title desc"><title id="title">GQA：多个 Q 头读取同一组 K/V</title><desc id="desc">Q的两个 [3,2] 头指向同一个 K/V 头；说明共享的是 K/V，不是注意力权重，也不要求物理复制共享张量。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a63a2a"/></marker></defs><rect width="960" height="880" fill="#fdfcf8"/><g font-family="Segoe UI,Microsoft YaHei,Noto Sans SC,sans-serif"><text x="24" y="38" fill="#1b1b1b" font-size="25" text-anchor="start" font-weight="600">GQA：多个 Q 头读取同一组 K/V</text><text x="24" y="72" fill="#57534b" font-size="17" text-anchor="start" font-weight="normal">小例：B=1、T=3、Hq=2、Hkv=1、d=2。每个小矩阵的行仍然是 token 位置。</text><text x="80" y="128" fill="#1b1b1b" font-size="20" text-anchor="start" font-weight="600">Q head 0 · [3,2]</text><text x="135.5" y="158" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">d0</text><text x="226.5" y="158" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">d1</text><text x="78" y="196.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t0</text><rect x="90" y="170" width="88" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="134.5" y="196.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">q00</text><rect x="181" y="170" width="88" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="225.5" y="196.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">q01</text><text x="78" y="236.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t1</text><rect x="90" y="210" width="88" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="134.5" y="236.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">q02</text><rect x="181" y="210" width="88" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="225.5" y="236.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">q03</text><text x="78" y="276.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t2</text><rect x="90" y="250" width="88" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="134.5" y="276.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">q04</text><rect x="181" y="250" width="88" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="225.5" y="276.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">q05</text><text x="606" y="128" fill="#1b1b1b" font-size="20" text-anchor="start" font-weight="600">Q head 1 · [3,2]</text><text x="661.5" y="158" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">d0</text><text x="752.5" y="158" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">d1</text><text x="604" y="196.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t0</text><rect x="616" y="170" width="88" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="660.5" y="196.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">q10</text><rect x="707" y="170" width="88" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="751.5" y="196.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">q11</text><text x="604" y="236.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t1</text><rect x="616" y="210" width="88" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="660.5" y="236.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">q12</text><rect x="707" y="210" width="88" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="751.5" y="236.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">q13</text><text x="604" y="276.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t2</text><rect x="616" y="250" width="88" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="660.5" y="276.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">q14</text><rect x="707" y="250" width="88" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="751.5" y="276.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">q15</text><text x="364" y="218" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="normal">2 个 Q heads</text><text x="364" y="249" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">各自算 scores / A</text><text x="184" y="390" fill="#1b1b1b" font-size="20" text-anchor="start" font-weight="600">共享 K head 0 · [3,2]</text><text x="262.0" y="421" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">d0</text><text x="354.0" y="421" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">d1</text><text x="204" y="459.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t0</text><rect x="216" y="433" width="89" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="261.0" y="459.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k0a</text><rect x="308" y="433" width="89" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="353.0" y="459.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k0b</text><text x="204" y="499.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t1</text><rect x="216" y="473" width="89" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="261.0" y="499.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k1a</text><rect x="308" y="473" width="89" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="353.0" y="499.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k1b</text><text x="204" y="539.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t2</text><rect x="216" y="513" width="89" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="261.0" y="539.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k2a</text><rect x="308" y="513" width="89" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="353.0" y="539.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k2b</text><text x="560" y="390" fill="#1b1b1b" font-size="20" text-anchor="start" font-weight="600">共享 V head 0 · [3,2]</text><text x="638.0" y="421" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">d0</text><text x="730.0" y="421" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">d1</text><text x="580" y="459.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t0</text><rect x="592" y="433" width="89" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="637.0" y="459.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">v0a</text><rect x="684" y="433" width="89" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="729.0" y="459.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">v0b</text><text x="580" y="499.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t1</text><rect x="592" y="473" width="89" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="637.0" y="499.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">v1a</text><rect x="684" y="473" width="89" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="729.0" y="499.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">v1b</text><text x="580" y="539.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t2</text><rect x="592" y="513" width="89" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="637.0" y="539.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">v2a</text><rect x="684" y="513" width="89" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="729.0" y="539.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">v2b</text><path d="M185 300 L305 361" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><path d="M707 300 L325 361" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><path d="M185 300 L680 361" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><path d="M707 300 L700 361" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="593" width="912" height="109" rx="6" fill="#f8efda" stroke="#d7d0c4"/><text x="42" y="624" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">映射的是 head 轴，不是把两个 token 合并</text><text x="42" y="655" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">group_size = Hq/Hkv = 2；kv_head = floor(q_head/2)。Q0→KV0，Q1→KV0。</text><text x="42" y="684" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">Q 的 12 个数不变；K 和 V 各只保存 6 个数。两组 Q 可以产生不同的注意力权重。</text><rect x="24" y="731" width="912" height="109" rx="6" fill="#eaf2ec" stroke="#d7d0c4"/><text x="42" y="762" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">重复的概念和实际分配不是一回事</text><text x="42" y="793" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">为讲公式，可把 K/V 沿 head 轴重复成 [1,2,3,2]；实际 GQA kernel 可直接读取共享头。</text><text x="42" y="822" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">更一般的 Hq=4、Hkv=2：Q0/Q1→KV0，Q2/Q3→KV1。</text></g></svg>