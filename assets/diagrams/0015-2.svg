<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 365" role="img" aria-labelledby="title"><title id="title">Qwen3-0.6B 的投影宽度</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a63a2a"/></marker></defs><rect width="720" height="365" fill="#fff"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="20" y="27" text-anchor="start" font-size="17" fill="#1b1b1b">Qwen3-0.6B 的投影宽度</text><rect x="20" y="60" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="125" y="89" text-anchor="middle" font-size="12" fill="#a63a2a">01</text><text x="125" y="113" text-anchor="middle" font-size="14" fill="#253d46">输入 hidden</text><text x="125" y="134" text-anchor="middle" font-size="14" fill="#253d46">H=1024</text><path d="M232 105L251 105" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="255" y="60" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="360" y="89" text-anchor="middle" font-size="12" fill="#a63a2a">02</text><text x="360" y="113" text-anchor="middle" font-size="14" fill="#253d46">Q 投影</text><text x="360" y="134" text-anchor="middle" font-size="14" fill="#253d46">16 × 128 = 2048</text><path d="M467 105L486 105" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="60" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="595" y="89" text-anchor="middle" font-size="12" fill="#a63a2a">03</text><text x="595" y="113" text-anchor="middle" font-size="14" fill="#253d46">K / V 各自</text><text x="595" y="134" text-anchor="middle" font-size="14" fill="#253d46">8 × 128 = 1024</text><path d="M595 150V178H125V199" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="205" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="125" y="234" text-anchor="middle" font-size="12" fill="#a63a2a">04</text><text x="125" y="258" text-anchor="middle" font-size="14" fill="#253d46">Attention 输出</text><text x="125" y="279" text-anchor="middle" font-size="14" fill="#253d46">16 × 128 = 2048</text><path d="M232 250L251 250" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="255" y="205" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="360" y="234" text-anchor="middle" font-size="12" fill="#a63a2a">05</text><text x="360" y="258" text-anchor="middle" font-size="14" fill="#253d46">O 投影</text><text x="360" y="279" text-anchor="middle" font-size="14" fill="#253d46">2048 → 1024</text><path d="M467 250L486 250" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="205" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="595" y="234" text-anchor="middle" font-size="12" fill="#a63a2a">06</text><text x="595" y="258" text-anchor="middle" font-size="14" fill="#253d46">残差相加</text><text x="595" y="279" text-anchor="middle" font-size="14" fill="#253d46">回到 H=1024</text></g></svg>