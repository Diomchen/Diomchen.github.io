<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 920" role="img" aria-labelledby="title desc"><title id="title">合头：每个 token 必须拿回它自己的所有 head</title><desc id="desc">同一组12个编号分别按 transpose后合头与直接reshape排列，直观看见后者把不同 token 的值混到一行。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a63a2a"/></marker></defs><rect width="960" height="920" fill="#fdfcf8"/><g font-family="Segoe UI,Microsoft YaHei,Noto Sans SC,sans-serif"><text x="24" y="38" fill="#1b1b1b" font-size="25" text-anchor="start" font-weight="600">合头：每个 token 必须拿回它自己的所有 head</text><text x="24" y="72" fill="#57534b" font-size="17" text-anchor="start" font-weight="normal">B=1、T=3、Hq=2、d=2；数字为元素身份。两边都有 12 个数，只有一边语义正确。</text><text x="80" y="125" fill="#1b1b1b" font-size="20" text-anchor="start" font-weight="600">输入 Oheads [1,2,3,2]</text><text x="92" y="169" fill="#1b1b1b" font-size="18" text-anchor="start" font-weight="normal">head 0</text><text x="136.5" y="197" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">d0</text><text x="219.5" y="197" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">d1</text><text x="83" y="235.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t0</text><rect x="95" y="209" width="80" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="135.5" y="235.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="178" y="209" width="80" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="218.5" y="235.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><text x="83" y="275.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t1</text><rect x="95" y="249" width="80" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="135.5" y="275.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">4</text><rect x="178" y="249" width="80" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="218.5" y="275.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">5</text><text x="83" y="315.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t2</text><rect x="95" y="289" width="80" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="135.5" y="315.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">8</text><rect x="178" y="289" width="80" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="218.5" y="315.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">9</text><text x="552" y="169" fill="#1b1b1b" font-size="18" text-anchor="start" font-weight="normal">head 1</text><text x="596.5" y="197" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">d0</text><text x="679.5" y="197" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">d1</text><text x="543" y="235.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t0</text><rect x="555" y="209" width="80" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="595.5" y="235.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">2</text><rect x="638" y="209" width="80" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="678.5" y="235.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3</text><text x="543" y="275.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t1</text><rect x="555" y="249" width="80" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="595.5" y="275.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">6</text><rect x="638" y="249" width="80" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="678.5" y="275.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">7</text><text x="543" y="315.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t2</text><rect x="555" y="289" width="80" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="595.5" y="315.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">10</text><rect x="638" y="289" width="80" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="678.5" y="315.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">11</text><text x="42" y="395" fill="#1b1b1b" font-size="20" text-anchor="start" font-weight="600">正确：先交换 head / T，再合并末两轴</text><text x="42" y="429" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">[1,2,3,2] → [1,3,2,2] → [1,3,4]</text><text x="114.5" y="465" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h0d0</text><text x="191.5" y="465" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h0d1</text><text x="268.5" y="465" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h1d0</text><text x="345.5" y="465" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h1d1</text><text x="64" y="503.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t0</text><rect x="76" y="477" width="74" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="113.5" y="503.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="153" y="477" width="74" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="190.5" y="503.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="230" y="477" width="74" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="267.5" y="503.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">2</text><rect x="307" y="477" width="74" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="344.5" y="503.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3</text><text x="64" y="543.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t1</text><rect x="76" y="517" width="74" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="113.5" y="543.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">4</text><rect x="153" y="517" width="74" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="190.5" y="543.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">5</text><rect x="230" y="517" width="74" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="267.5" y="543.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">6</text><rect x="307" y="517" width="74" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="344.5" y="543.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">7</text><text x="64" y="583.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t2</text><rect x="76" y="557" width="74" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="113.5" y="583.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">8</text><rect x="153" y="557" width="74" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="190.5" y="583.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">9</text><rect x="230" y="557" width="74" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="267.5" y="583.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">10</text><rect x="307" y="557" width="74" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="344.5" y="583.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">11</text><text x="509" y="395" fill="#a63a2a" font-size="19" text-anchor="start" font-weight="600">错误：直接把 head-major 逻辑顺序展平</text><text x="509" y="429" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">shape 也能是 [1,3,4]，但 token 已混排</text><text x="594.5" y="465" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">列0</text><text x="671.5" y="465" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">列1</text><text x="748.5" y="465" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">列2</text><text x="825.5" y="465" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">列3</text><text x="544" y="503.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">行0</text><rect x="556" y="477" width="74" height="37" rx="3" fill="#f8e5df" stroke="#d7d0c4"/><text x="593.5" y="503.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="633" y="477" width="74" height="37" rx="3" fill="#f8e5df" stroke="#d7d0c4"/><text x="670.5" y="503.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="710" y="477" width="74" height="37" rx="3" fill="#f8e5df" stroke="#d7d0c4"/><text x="747.5" y="503.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">4</text><rect x="787" y="477" width="74" height="37" rx="3" fill="#f8e5df" stroke="#d7d0c4"/><text x="824.5" y="503.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">5</text><text x="544" y="543.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">行1</text><rect x="556" y="517" width="74" height="37" rx="3" fill="#f8e5df" stroke="#d7d0c4"/><text x="593.5" y="543.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">8</text><rect x="633" y="517" width="74" height="37" rx="3" fill="#f8e5df" stroke="#d7d0c4"/><text x="670.5" y="543.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">9</text><rect x="710" y="517" width="74" height="37" rx="3" fill="#f8e5df" stroke="#d7d0c4"/><text x="747.5" y="543.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">2</text><rect x="787" y="517" width="74" height="37" rx="3" fill="#f8e5df" stroke="#d7d0c4"/><text x="824.5" y="543.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3</text><text x="544" y="583.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">行2</text><rect x="556" y="557" width="74" height="37" rx="3" fill="#f8e5df" stroke="#d7d0c4"/><text x="593.5" y="583.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">6</text><rect x="633" y="557" width="74" height="37" rx="3" fill="#f8e5df" stroke="#d7d0c4"/><text x="670.5" y="583.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">7</text><rect x="710" y="557" width="74" height="37" rx="3" fill="#f8e5df" stroke="#d7d0c4"/><text x="747.5" y="583.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">10</text><rect x="787" y="557" width="74" height="37" rx="3" fill="#f8e5df" stroke="#d7d0c4"/><text x="824.5" y="583.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">11</text><rect x="24" y="632" width="912" height="109" rx="6" fill="#f8efda" stroke="#d7d0c4"/><text x="42" y="663" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">检查第一行就能发现错误</text><text x="42" y="694" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">正确行 t0 = [head0 的 0,1 | head1 的 2,3]。直接 reshape 则拿到 [0,1,4,5]。</text><text x="42" y="723" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">后者混入 head0 的 t1 值；元素总数正确，并不能保证语义正确。</text><rect x="24" y="769" width="912" height="109" rx="6" fill="#eaf2ec" stroke="#d7d0c4"/><text x="42" y="800" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">合头完成后，才做输出投影</text><text x="42" y="831" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">Oflat[b,t,h·d+j] = Oheads[b,h,t,j]；常见写法为 transpose → contiguous → view。</text><text x="42" y="860" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">本例 Wo 为 [4,4]；Qwen3-0.6B 则为数学形状 [2048,1024]，将结果送回残差宽度 H。</text></g></svg>