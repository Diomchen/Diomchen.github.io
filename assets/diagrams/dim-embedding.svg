<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 742" role="img" aria-labelledby="title desc"><title id="title">Embedding：整数索引怎样变成向量</title><desc id="desc">逐行展示 ids=[2,0,4] 如何从 E[6,4] 读取三行，得到 X[1,3,4]；输入索引数量与输出浮点元素数不同，查表不是 reshape。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a63a2a"/></marker></defs><rect width="960" height="742" fill="#fdfcf8"/><g font-family="Segoe UI,Microsoft YaHei,Noto Sans SC,sans-serif"><text x="24" y="38" fill="#1b1b1b" font-size="25" text-anchor="start" font-weight="600">Embedding：整数索引怎样变成向量</text><text x="24" y="72" fill="#57534b" font-size="17" text-anchor="start" font-weight="normal">小例：B=1、T=3、H=4、Vocab=6；下面只画 batch 0。颜色和行号同时标记对应关系。</text><text x="40" y="126" fill="#1b1b1b" font-size="20" text-anchor="start" font-weight="600">① token IDs [1,3]</text><text x="74.0" y="154" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">t0</text><text x="138.0" y="154" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">t1</text><text x="202.0" y="154" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">t2</text><rect x="42" y="166" width="61" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="73.0" y="192.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">2</text><rect x="106" y="166" width="61" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="137.0" y="192.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="170" y="166" width="61" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="201.0" y="192.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">4</text><text x="42" y="245" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">这里只有 3 个整数。</text><text x="42" y="274" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">整数决定查哪一行，</text><text x="42" y="303" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">不是 3 个语义分量。</text><text x="330" y="126" fill="#1b1b1b" font-size="20" text-anchor="start" font-weight="600">② E [Vocab=6,H=4]</text><text x="376.5" y="154" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h0</text><text x="425.5" y="154" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h1</text><text x="474.5" y="154" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h2</text><text x="523.5" y="154" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h3</text><text x="340" y="192.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">id=0</text><rect x="352" y="166" width="46" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="375.5" y="192.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="401" y="166" width="46" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="424.5" y="192.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="450" y="166" width="46" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="473.5" y="192.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">2</text><rect x="499" y="166" width="46" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="522.5" y="192.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3</text><text x="340" y="232.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">id=1</text><rect x="352" y="206" width="46" height="37" rx="3" fill="#f2f0eb" stroke="#d7d0c4"/><text x="375.5" y="232.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">10</text><rect x="401" y="206" width="46" height="37" rx="3" fill="#f2f0eb" stroke="#d7d0c4"/><text x="424.5" y="232.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight