rx="3" fill="#f2f0eb" stroke="#d7d0c4"/><text x="522.5" y="312.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">33</text><text x="340" y="352.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">id=4</text><rect x="352" y="326" width="46" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="375.5" y="352.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">40</text><rect x="401" y="326" width="46" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="424.5" y="352.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">41</text><rect x="450" y="326" width="46" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="473.5" y="352.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">42</text><rect x="499" y="326" width="46" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="522.5" y="352.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">43</text><text x="340" y="392.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">id=5</text><rect x="352" y="366" width="46" height="37" rx="3" fill="#f2f0eb" stroke="#d7d0c4"/><text x="375.5" y="392.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">50</text><rect x="401" y="366" width="46" height="37" rx="3" fill="#f2f0eb" stroke="#d7d0c4"/><text x="424.5" y="392.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">51</text><rect x="450" y="366" width="46" height="37" rx="3" fill="#f2f0eb" stroke="#d7d0c4"/><text x="473.5" y="392.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">52</text><rect x="499" y="366" width="46" height="37" rx="3" fill="#f2f0eb" stroke="#d7d0c4"/><text x="522.5" y="392.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">53</text><text x="646" y="126" fill="#1b1b1b" font-size="20" text-anchor="start" font-weight="600">③ X [1,3,4]</text><text x="717.0" y="154" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h0</text><text x="771.0" y="154" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h1</text><text x="825.0" y="154" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h2</text><text x="879.0" y="154" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h3</text><text x="678" y="192.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t0</text><rect x="690" y="166" width="51" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="716.0" y="192.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">20</text><rect x="744" y="166" width="51" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="770.0" y="192.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">21</text><rect x="798" y="166" width="51" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="824.0" y="192.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">22</text><rect x="852" y="166" width="51" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="878.0" y="192.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">23</text><text x="678" y="232.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t1</text><rect x="690" y="206" width="51" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="716.0" y="232.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="744" y="206" width="51" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="770.0" y="232.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="798" y="206" width="51" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="824.0" y="232.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">2</text><rect x="852" y="206" width="51" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="878.0" y="232.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3</text><text x="678" y="272.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t2</text><rect x="690" y="246" width="51" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="716.0" y="272.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">40</text><rect x="744" y="246" width="51" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="770.0" y="272.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">41</text><rect x="798" y="246" width="51" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="824.0" y="272.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">42</text><rect x="852" y="246" width="51" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="878.0" y="272.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">43</text><path d="M244 117 L292 117" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><path d="M570 117 L628 117" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><text x="646" y="331" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">每个 token 得到 4 个数。</text><text x="646" y="360" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">输出共有 1×3×4 = 12 个数。</text><rect x="24" y="445" width="912" height="109" rx="6" fill="#f8efda" stroke="#d7d0c4"/><text x="42" y="476" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">固定 b=0，沿着一个元素追踪</text><text x="42" y="507" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">X[0,0,2] = E[ids[0,0],2] = E[2,2] = 22</text><text x="42" y="536" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">X[0,1,:] = E[0,:]；X[0,2,:] = E[4,:]。冒号表示取完整轴。</text><rect x="24" y="585" width="912" height="109" rx="6" fill="#eaf2ec" stroke="#d7d0c4"/><text x="42" y="616" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">查表不是 reshape</text><text x="42" y="647" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">输入的 3 个 ID 不会被“重排成”12 个数；输出来自参数表 E。</text><text x="42" y="676" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">同一个 ID 出现两次，就读取同一行两次。这里的数值只用于辨认元素。</text></g></svg>