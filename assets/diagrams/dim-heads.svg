<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 910" role="img" aria-labelledby="title desc"><title id="title">分头与转置：追踪编号 2，而不是只背 shape</title><desc id="desc">编号0至11由 [1,3,4] 拆成 [1,3,2,2]，再转置为 [1,2,3,2]；逐 head 画出矩阵，并追踪编号2的三套坐标。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a63a2a"/></marker></defs><rect width="960" height="910" fill="#fdfcf8"/><g font-family="Segoe UI,Microsoft YaHei,Noto Sans SC,sans-serif"><text x="24" y="38" fill="#1b1b1b" font-size="25" text-anchor="start" font-weight="600">分头与转置：追踪编号 2，而不是只背 shape</text><text x="24" y="72" fill="#57534b" font-size="17" text-anchor="start" font-weight="normal">数字 0…11 是元素身份标签，不是 attention 计算结果。B=1、T=3、Hq=2、d=2。</text><text x="42" y="126" fill="#1b1b1b" font-size="20" text-anchor="start" font-weight="600">① Qflat [1,3,4]：每个 token 一行</text><text x="124.0" y="158" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h0·d0</text><text x="198.0" y="158" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h0·d1</text><text x="272.0" y="158" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h1·d0</text><text x="346.0" y="158" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h1·d1</text><text x="75" y="196.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t0</text><rect x="87" y="170" width="71" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="123.0" y="196.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="161" y="170" width="71" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="197.0" y="196.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="235" y="170" width="71" height="37" rx="3" fill="#eaf2ec" stroke="#a63a2a"/><rect x="237" y="172" width="67" height="33" rx="2" fill="none" stroke="#a63a2a" stroke-width="2"/><text x="271.0" y="196.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">2</text><rect x="309" y="170" width="71" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="345.0" y="196.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3</text><text x="75" y="236.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t1</text><rect x="87" y="210" width="71" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="123.0" y="236.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">4</text><rect x="161" y="210" width="71" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="197.0" y="236.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">5</text><rect x="235" y="210" width="71" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="271.0" y="236.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">6</text><rect x="309" y="210" width="71" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="345.0" y="236.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">7</text><text x="75" y="276.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t2</text><rect x="87" y="250" width="71" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="123.0" y="276.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">8</text><rect x="161" y="250" width="71" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="197.0" y="276.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">9</text><rect x="235" y="250" width="71" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="271.0" y="276.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">10</text><rect x="309" y="250" width="71" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="345.0" y="276.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">11</text><text x="465" y="166" fill="#57534b" font-size="19" text-anchor="start" font-weight="normal">② reshape → [1,3,2,2]</text><text x="465" y="195" fill="#57534b" font-size="19" text-anchor="start" font-weight="normal">把末轴 4 拆成 head=2、d=2。</text><text x="465" y="224" fill="#57534b" font-size="19" text-anchor="start" font-weight="normal">每行左两格归 head 0，右两格归 head 1。</text><text x="465" y="253" fill="#57534b" font-size="19" text-anchor="start" font-weight="normal">元素顺序与数值均不改变。</text><text x="465" y="282" fill="#57534b" font-size="19" text-anchor="start" font-weight="normal">例如编号 2：t=0、head=1、d=0。</text><text x="42" y="334" fill="#1b1b1b" font-size="20" text-anchor="start" font-weight="600">③ transpose(1,2) → [1,2,3,2]：按 head 分开展示</text><text x="110" y="424" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">head 0 · [T=3,d=2]</text><text x="171.0" y="450" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">d0</text><text x="269.0" y="450" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">d1</text><text x="110" y="488.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t0</text><rect x="122" y="462" width="95" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="170.0" y="488.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="220" y="462" width="95" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="268.0" y="488.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><text x="110" y="528.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t1</text><rect x="122" y="502" width="95" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="170.0" y="528.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">4</text><rect x="220" y="502" width="95" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="268.0" y="528.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">5</text><text x="110" y="568.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t2</text><rect x="122" y="542" width="95" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="170.0" y="568.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">8</text><rect x="220" y="542" width="95" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="268.0" y="568.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">9</text><text x="530" y="424" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">head 1 · [T=3,d=2]</text><text x="591.0" y="450" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">d0</text><text x="689.0" y="450" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">d1</text><text x="530" y="488.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t0</text><rect x="542" y="462" width="95" height="37" rx="3" fill="#eaf2ec" stroke="#a63a2a"/><rect x="544" y="464" width="91" height="33" rx="2" fill="none" stroke="#a63a2a" stroke-width="2"/><text x="590.0" y="488.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">2</text><rect x="640" y="462" width="95" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="688.0" y="488.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3</text><text x="530" y="528.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t1</text><rect x="542" y="502" width="95" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="590.0" y="528.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">6</text><rect x="640" y="502" width="95" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="688.0" y="528.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">7</text><text x="530" y="568.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t2</text><rect x="542" y="542" width="95" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="590.0" y="568.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">10</text><rect x="640" y="542" width="95" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="688.0" y="568.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">11</text><path d="M270 350 L215 397" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><path d="M344 350 L638 397" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="24" y="620" width="912" height="109" rx="6" fill="#f8efda" stroke="#d7d0c4"/><text x="42" y="651" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">同一个元素，只换坐标的写法</text><text x="42" y="682" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">Qflat[0,0,2] = Qsplit[0,0,1,0] = Qheads[0,1,0,0] = 2</text><text x="42" y="711" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">一般式：Qflat[b,t,h·d+j] = Qsplit[b,t,h,j] = Qheads[b,h,t,j]。</text><rect x="24" y="758" width="912" height="109" rx="6" fill="#eaf2ec" stroke="#d7d0c4"/><text x="42" y="789" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">轴顺序和物理拷贝分开理解</text><text x="42" y="820" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">12 个数始终是 12 个数。transpose 交换 T 与 head 的逻辑坐标；它通常是共享存储的 view。</text><text x="42" y="849" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">需要连续存储时，contiguous() 才可能按新轴顺序复制数据；reshape 也可能因布局而复制。</text></g></svg>