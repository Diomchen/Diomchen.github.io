538" y="805.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">f3</text><rect x="550" y="782" width="54" height="31" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="577.5" y="805.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="607" y="782" width="54" height="31" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="634.5" y="805.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="664" y="782" width="54" height="31" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="691.5" y="805.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="721" y="782" width="54" height="31" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="748.5" y="805.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><text x="538" y="839.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">f4</text><rect x="550" y="816" width="54" height="31" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="577.5" y="839.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="607" y="816" width="54" height="31" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="634.5" y="839.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="664" y="816" width="54" height="31" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="691.5" y="839.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="721" y="816" width="54" height="31" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="748.5" y="839.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><text x="538" y="873.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">f5</text><rect x="550" y="850" width="54" height="31" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="577.5" y="873.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="607" y="850" width="54" height="31" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="634.5" y="873.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="664" y="850" width="54" height="31" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="691.5" y="873.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="721" y="850" width="54" height="31" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="748.5" y="873.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><text x="42" y="766" fill="#1b1b1b" font-size="18" text-anchor="start" font-weight="normal">对 F=6 求和；右侧权重是本图选取的示例。</text><text x="42" y="807" fill="#1b1b1b" font-size="18" text-anchor="start" font-weight="normal">t0 的输出：[8.57, 16.608, 8.808, 20.071]</text><text x="42" y="850" fill="#1b1b1b" font-size="18" text-anchor="start" font-weight="normal">例如 Y[t0,h0] = z0 + z4 ≈ -0.238 + 8.808 = 8.570。</text><rect x="24" y="918" width="912" height="109" rx="6" fill="#f8efda" stroke="#d7d0c4"/><text x="42" y="949" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">整层的元素数变化</text><text x="42" y="980" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">输入 1×3×4=12 → gate_up 1×3×12=36 → z 1×3×6=18 → down 输出 12。</text><text x="42" y="1009" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">最后才能与原始 X [1,3,4] 逐元素相加；RMSNorm 本身不改变这三个轴的长度。</text></g></svg>