<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1070" role="img" aria-labelledby="title desc"><title id="title">SwiGLU：扩大、切半、逐元素门控、投回 hidden</title><desc id="desc">放大一个token的12维gate_up，切为两个6维向量，实际计算SiLU与逐元素乘积，再经6×4矩阵投回hidden宽度。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a63a2a"/></marker></defs><rect width="960" height="1070" fill="#fdfcf8"/><g font-family="Segoe UI,Microsoft YaHei,Noto Sans SC,sans-serif"><text x="24" y="38" fill="#1b1b1b" font-size="25" text-anchor="start" font-weight="600">SwiGLU：扩大、切半、逐元素门控、投回 hidden</text><text x="24" y="72" fill="#57534b" font-size="17" text-anchor="start" font-weight="normal">小例：B=1、T=3、H=4、F=6。激活值和权重仅用于手算；小数显示到三位。</text><text x="42" y="123" fill="#57534b" font-size="19" text-anchor="start" font-weight="normal">① X [1,3,4] × Wgate_up [4,12] → GU [1,3,12]；每个 token 算出 12 个新值。</text><text x="42" y="152" fill="#57534b" font-size="19" text-anchor="start" font-weight="normal">② split([F,F])：gate [1,3,6]、up [1,3,6]。下面放大 t=0 的一行。</text><text x="109.5" y="207" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">g0</text><text x="176.5" y="207" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">g1</text><text x="243.5" y="207" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">g2</text><text x="310.5" y="207" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">g3</text><text x="377.5" y="207" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">g4</text><text x="444.5" y="207" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">g5</text><text x="511.5" y="207" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">u0</text><text x="578.5" y="207" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">u1</text><text x="645.5" y="207" fill="#57534b" font-size=