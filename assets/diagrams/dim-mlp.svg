 y="245.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3</text><rect x="679" y="219" width="64" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="711.5" y="245.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">4</text><rect x="746" y="219" width="64" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="778.5" y="245.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">5</text><rect x="813" y="219" width="64" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="845.5" y="245.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">6</text><text x="76" y="297" fill="#1b1b1b" font-size="18" text-anchor="start" font-weight="normal">gate 的 6 个数</text><text x="478" y="297" fill="#1b1b1b" font-size="18" text-anchor="start" font-weight="normal">up 的 6 个数</text><text x="42" y="356" fill="#1b1b1b" font-size="20" text-anchor="start" font-weight="600">③ SiLU(gate) ⊙ up：同坐标逐元素相乘，不做矩阵乘法</text><text x="220.0" y="389" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">f0</text><text x="320.0" y="389" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">f1</text><text x="420.0" y="389" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">f2</text><text x="520.0" y="389" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">f3</text><text x="620.0" y="389" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">f4</text><text x="720.0" y="389" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">f5</text><text x="158" y="427.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">SiLU(gate)</text><rect x="170" y="401" width="97" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="219.0" y="427.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">-0.238</text><rect x="270" y="401" width="97" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="319.0" y="427.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">-0.269</text><rect x="370" y="401" width="97" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="419.0" y="427.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0.000</text><rect x="470" y="401" width="97" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="519.0" y="427.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0.731</text><rect x="570" y="401" width="97" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="619.0" y="427.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1.762</text><rect x="670" y="401" width="97" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="719.0" y="427.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">2.858</text><text x="158" y="467.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">up</text><rect x="170" y="441" width="97" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="219.0" y="467.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="270" y="441" width="97" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="319.0" y="467.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">2</text><rect x="370" y="441" width="97" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="419.0" y="467.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3</text><rect x="470" y="441" width="97" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="519.0" y="467.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">4</text><rect x="570" y="441" width="97" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="619.0" y="467.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">5</text><rect x="670" y="44