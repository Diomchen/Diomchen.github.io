<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 365" role="img" aria-labelledby="title"><title id="title">置信度决定验证工作量，不直接决定接受</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a63a2a"/></marker></defs><rect width="720" height="365" fill="#fff"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="20" y="27" text-anchor="start" font-size="17" fill="#1b1b1b">置信度决定验证工作量，不直接决定接受</text><rect x="20" y="60" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="125" y="89" text-anchor="middle" font-size="12" fill="#a63a2a">01</text><text x="125" y="113" text-anchor="middle" font-size="14" fill="#253d46">draft tokens</text><text x="125" y="134" text-anchor="middle" font-size="14" fill="#253d46">产生候选</text><path d="M232 105L251 105" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="255" y="60" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="360" y="89" text-anchor="middle" font-size="12" fill="#a63a2a">02</text><text x="360" y="113" text-anchor="middle" font-size="14" fill="#253d46">confidence head</text><text x="360" y="134" text-anchor="middle" font-size="14" fill="#253d46">逐位置估计</text><path d="M467 105L486 105" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="60" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="595" y="89" text-anchor="middle" font-size="12" fill="#a63a2a">03</text><text x="595" y="113" text-anchor="middle" font-size="14" fill="#253d46">前缀概率累乘</text><text x="595" y="134" text-anchor="middle" font-size="14" fill="#253d46">前面接受才轮到后面</text><path d="M595 150V178H125V199" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="205" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="125" y="234" text-anchor="middle" font-size="12" fill="#a63a2a">04</text><text x="125" y="258" text-anchor="middle" font-size="14" fill="#253d46">全局候选预算</text><text x="125" y="279" text-anchor="middle" font-size="14" fill="#253d46">结合graph耗时</text><path d="M232 250L251 250" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="255" y="205" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="360" y="234" text-anchor="middle" font-size="12" fill="#a63a2a">05</text><text x="360" y="258" text-anchor="middle" font-size="14" fill="#253d46">target验证 + sampler</text><text x="360" y="279" text-anchor="middle" font-size="14" fill="#253d46">决定实际接受</text><path d="M467 250L486 250" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="205" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="595" y="234" text-anchor="middle" font-size="12" fill="#a63a2a">06</text><text x="595" y="258" text-anchor="middle" font-size="14" fill="#253d46">commit与KV对账</text><text x="595" y="279" text-anchor="middle" font-size="14" fill="#253d46">丢弃无效后缀</text></g></svg>