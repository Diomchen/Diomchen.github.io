<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title"><title id="title">不要混淆三种“进度”</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a63a2a"/></marker></defs><rect width="720" height="320" fill="#fff"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="20" y="27" text-anchor="start" font-size="17" fill="#1b1b1b">不要混淆三种“进度”</text><text x="350" y="52" text-anchor="middle" font-size="14" fill="#253d46">每个 token 都有“已知 ID”与“已算 KV”两种时刻</text><text x="70" y="100" text-anchor="middle" font-size="13" fill="#253d46">已知 token IDs</text><rect x="140" y="75" width="78" height="42" rx="5" fill="#e3ede6" stroke="#8aa7b5"/><text x="179" y="102" text-anchor="middle" font-size="13" fill="#253d46">有效</text><rect x="226" y="75" width="78" height="42" rx="5" fill="#e3ede6" stroke="#8aa7b5"/><text x="265" y="102" text-anchor="middle" font-size="13" fill="#253d46">有效</text><rect x="312" y="75" width="78" height="42" rx="5" fill="#eeeae4" stroke="#8aa7b5"/><text x="351" y="102" text-anchor="middle" font-size="13" fill="#253d46">未算</text><rect x="398" y="75" width="78" height="42" rx="5" fill="#eeeae4" stroke="#8aa7b5"/><text x="437" y="102" text-anchor="middle" font-size="13" fill="#253d46">未算</text><rect x="484" y="75" width="78" height="42" rx="5" fill="#eeeae4" stroke="#8aa7b5"/><text x="523" y="102" text-anchor="middle" font-size="13" fill="#253d46">未算</text><rect x="570" y="75" width="78" height="42" rx="5" fill="#eeeae4" stroke="#8aa7b5"/><text x="609" y="102" text-anchor="middle" font-size="13" fill="#253d46">未算</text><text x="70" y="166" text-anchor="middle" font-size="13" fill="#253d46">已计算的 KV</text><rect x="140" y="141" width="78" height="42" rx="5" fill="#e3ede6" stroke="#8aa7b5"/><text x="179" y="168" text-anchor="middle" font-size="13" fill="#253d46">有效</text><rect x="226" y="141" width="78" height="42" rx="5" fill="#e3ede6" stroke="#8aa7b5"/><text x="265" y="168" text-anchor="middle" font-size="13" fill="#253d46">有效</text><rect x="312" y="141" width="78" height="42" rx="5" fill="#e3ede6" stroke="#8aa7b5"/><text x="351" y="168" text-anchor="middle" font-size="13" fill="#253d46">有效</text><rect x="398" y="141" width="78" height="42" rx="5" fill="#eeeae4" stroke="#8aa7b5"/><text x="437" y="168" text-anchor="middle" font-size="13" fill="#253d46">未算</text><rect x="484" y="141" width="78" height="42" rx="5" fill="#eeeae4" stroke="#8aa7b5"/><text x="523" y="168" text-anchor="middle" font-size="13" fill="#253d46">未算</text><rect x="570" y="141" width="78" height="42" rx="5" fill="#eeeae4" stroke="#8aa7b5"/><text x="609" y="168" text-anchor="middle" font-size="13" fill="#253d46">未算</text><text x="70" y="232" text-anchor="middle" font-size="13" fill="#253d46">本轮 scheduled</text><rect x="140" y="207" width="78" height="42" rx="5" fill="#e3ede6" stroke="#8aa7b5"/><text x="179" y="234" text-anchor="middle" font-size="13" fill="#253d46">有效</text><rect x="226" y="207" width="78" height="42" rx="5" fill="#e3ede6" stroke="#8aa7b5"/><text x="265" y="234" text-anchor="middle" font-size="13" fill="#253d46">有效</text><rect x="312" y="207" width="78" height="42" rx="5" fill="#e3ede6" stroke="#8aa7b5"/><text x="351" y="234" text-anchor="middle" font-size="13" fill="#253d46">有效</text><rect x="398" y="207" width="78" height="42" rx="5" fill="#e3ede6" stroke="#8aa7b5"/><text x="437" y="234" text-anchor="middle" font-size="13" fill="#253d46">有效</text><rect x="484" y="207" width="78" height="42" rx="5" fill="#eeeae4" stroke="#8aa7b5"/><text x="523" y="234" text-anchor="middle" font-size="13" fill="#253d46">未算</text><rect x="570" y="207" width="78" height="42" rx="5" fill="#eeeae4" stroke="#8aa7b5"/><text x="609" y="234" text-anchor="middle" font-size="13" fill="#253d46">未算</text><text x="350" y="300" text-anchor="middle" font-size="13" fill="#253d46">颜色表示状态；时间从左向右。具体数值见正文。</text></g></svg>