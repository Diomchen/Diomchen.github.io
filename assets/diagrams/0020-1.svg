<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title"><title id="title">Pre-Norm attention 子层</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a63a2a"/></marker></defs><rect width="720" height="320" fill="#fff"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="20" y="27" text-anchor="start" font-size="17" fill="#1b1b1b">Pre-Norm attention 子层</text><rect x="20" y="100" width="100" height="55" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="70" y="132" text-anchor="middle" font-size="18" fill="#253d46">x</text><path d="M125 128L175 128" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="180" y="100" width="160" height="55" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="260" y="132" text-anchor="middle" font-size="15" fill="#253d46">RMSNorm</text><path d="M345 128L395 128" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="400" y="100" width="160" height="55" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="480" y="132" text-anchor="middle" font-size="15" fill="#253d46">Attention</text><path d="M565 128L615 128" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="620" y="100" width="70" height="55" rx="5" fill="#e3ede6" stroke="#8aa7b5"/><text x="655" y="132" text-anchor="middle" font-size="22" fill="#253d46">+</text><path d="M70 98V55H655V96" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><text x="360" y="222" text-anchor="middle" font-size="15" fill="#253d46">x₁ = x + Attention(RMSNorm(x))</text><text x="360" y="260" text-anchor="middle" font-size="14" fill="#253d46">残差支路与变换支路在相同 hidden width 上相加。</text></g></svg>