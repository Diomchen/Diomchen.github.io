<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 900" role="img" aria-labelledby="title desc"><title id="title">变长 batch 压平：被拿掉的是 padding，不是请求边界</title><desc id="desc">将长度3和2的两条请求从 padded [2,3,4] 收集到 [5,4]，逐行标出来源，并用 cu_seqlens=[0,3,5] 恢复请求边界。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a63a2a"/></marker></defs><rect width="960" height="900" fill="#fdfcf8"/><g font-family="Segoe UI,Microsoft YaHei,Noto Sans SC,sans-serif"><text x="24" y="38" fill="#1b1b1b" font-size="25" text-anchor="start" font-weight="600">变长 batch 压平：被拿掉的是 padding，不是请求边界</text><text x="24" y="72" fill="#57534b" font-size="17" text-anchor="start" font-weight="normal">本图换成 B=2：请求 A 长3，请求 B 长2；H=4。每一行始终包含一个 token 的 4 个分量。</text><text x="42" y="126" fill="#1b1b1b" font-size="20" text-anchor="start" font-weight="600">① padded X [B=2,Tmax=3,H=4]</text><text x="159.5" y="157" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h0</text><text x="226.5" y="157" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h1</text><text x="293.5" y="157" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h2</text><text x="360.5" y="157" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h3</text><text x="114" y="195.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">A,t0</text><rect x="126" y="169" width="64" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="158.5" y="195.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="193" y="169" width="64" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="225.5" y="195.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="260" y="169" width="64" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="292.5" y="195.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">2</text><rect x="327" y="169" width="64" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="359.5" y="195.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3</text><text x="114" y="235.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">A,t1</text><rect x="126" y="209" width="64" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="158.5" y="235.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">4</text><rect x="193" y="209" width="64" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="225.5" y="235.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">5</text><rect x="260" y="209" width="64" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="292.5" y="235.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">6</text><rect x="327" y="209" width="64" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="359.5" y="235.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">7</text><text x="114" y="275.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">A,t2</text><rect x="126" y="249" width="64" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="158.5" y="275.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">8</text><rect x="193" y="249" width="64" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="225.5" y="275.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">9</text><rect x="260" y="249" width="64" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="292.5" y="275.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">10</text><rect x="327" y="249" width="64" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="359.5" y="275.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">11</text><text x="114" y="315.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">B,t0</text><rect x="126" y="289" width="64" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="158.5" y="315.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">12</text><rect x="193" y="289" width="64" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="225.5" y="315.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">13</text><rect x="260" y="289" width="64" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="292.5" y="315.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">14</text><rect x="327" y="289" width="64" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="359.5" y="315.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">15</text><text x="114" y="355.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">B,t1</text><rect x="126" y="329" width="64" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="158.5" y="355.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">16</text><rect x="193" y="329" width="64" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="225.5" y="355.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">17</text><rect x="260" y="329" width="64" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="292.5" y="355.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">18</text><rect x="327" y="329" width="64" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="359.5" y="355.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">19</text><text x="114" y="395.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">B,PAD</text><rect x="126" y="369" width="64" height="37" rx="3" fill="#eee9e2" stroke="#d7d0c4"/><text x="158.5" y="395.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">PAD</text><rect x="193" y="369" width="64" height="37" rx="3" fill="#eee9e2" stroke="#d7d0c4"/><text x="225.5" y="395.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">PAD</text><rect x="260" y="369" width="64" height="37" rx="3" fill="#eee9e2" stroke="#d7d0c4"/><text x="292.5" y="395.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">PAD</text><rect x="327" y="369" width="64" height="37" rx="3" fill="#eee9e2" stroke="#d7d0c4"/><text x="359.5" y="395.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">PAD</text><text x="566" y="126" fill="#1b1b1b" font-size="20" text-anchor="start" font-weight="600">② packed X [N=5,H=4]</text><text x="678.5" y="157" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h0</text><text x="739.5" y="157" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h1</text><text x="800.5" y="157" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h2</text><text x="861.5" y="157" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h3</text><text x="636" y="195.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">n0=A,t0</text><rect x="648" y="169" width="58" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="677.5" y="195.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="709" y="169" width="58" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="738.5" y="195.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="770" y="169" width="58" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="799.5" y="195.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">2</text><rect x="831" y="169" width="58" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="860.5" y="195.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3</text><text x="636" y="235.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">n1=A,t1</text><rect x="648" y="209" width="58" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="677.5" y="235.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">4</text><rect x="709" y="209" width="58" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="738.5" y="235.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">5</text><rect x="770" y="209" width="58" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="799.5" y="235.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">6</text><rect x="831" y="209" width="58" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="860.5" y="235.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">7</text><text x="636" y="275.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">n2=A,t2</text><rect x="648" y="249" width="58" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="677.5" y="275.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">8</text><rect x="709" y="249" width="58" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="738.5" y="275.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">9</text><rect x="770" y="249" width="58" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="799.5" y="275.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">10</text><rect x="831" y="249" width="58" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="860.5" y="275.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">11</text><text x="636" y="315.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">n3=B,t0</text><rect x="648" y="289" width="58" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="677.5" y="315.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">12</text><rect x="709" y="289" width="58" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="738.5" y="315.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">13</text><rect x="770" y="289" width="58" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="799.5" y="315.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">14</text><rect x="831" y="289" width="58" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="860.5" y="315.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">15</text><text x="636" y="355.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">n4=B,t1</text><rect x="648" y="329" width="58" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="677.5" y="355.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">16</text><rect x="709" y="329" width="58" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="738.5" y="355.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">17</text><rect x="770" y="329" width="58" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="799.5" y="355.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">18</text><rect x="831" y="329" width="58" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="860.5" y="355.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">19</text><path d="M417 265 L508 265" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><text x="433" y="307" fill="#a63a2a" font-size="17" text-anchor="start" font-weight="normal">只取有效行</text><rect x="24" y="450" width="912" height="109" rx="6" fill="#f8efda" stroke="#d7d0c4"/><text x="42" y="481" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">N 不是 B×Tmax，而是有效 token 数之和</text><text x="42" y="512" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">lengths = [3,2]；N=3+2=5。去掉 padding 后，24 个槽位变成 20 个有效数。</text><text x="42" y="541" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">这一步需要按有效行 gather / 拼接；不能把含 PAD 的数组直接 reshape 成 [5,4]。</text><text x="42" y="620" fill="#1b1b1b" font-size="20" text-anchor="start" font-weight="600">③ 元数据把请求边界补回来</text><text x="125.5" y="658" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">起点 A</text><text x="224.5" y="658" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">起点 B</text><text x="323.5" y="658" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">结束</text><rect x="76" y="670" width="96" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="124.5" y="696.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="175" y="670" width="96" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="223.5" y="696.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3</text><rect x="274" y="670" width="96" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="322.5" y="696.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">5</text><text x="431" y="664" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">cu_seqlens = [0,3,5]</text><text x="431" y="693" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">A 取 packed[0:3]；B 取 packed[3:5]。</text><text x="431" y="722" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">positions = [0,1,2,0,1]，不会跨请求连续编号。</text><rect x="24" y="751" width="912" height="109" rx="6" fill="#eaf2ec" stroke="#d7d0c4"/><text x="42" y="782" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">重新解释轴，不能丢失请求语义</text><text x="42" y="813" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">packed attention 通过边界元数据隔离请求；A 的 Q 不能读到 B 的 K/V。</text><text x="42" y="842" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">本例画完整 prefill。带前缀缓存时，cu_seqlens_q 与 cu_seqlens_k 可能不同。</text></g></svg>