<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1069" role="img" aria-labelledby="title desc"><title id="title">Tensor Parallel：切输出列与切输入行，有什么不同</title><desc id="desc">用完整小矩阵展示输入复制、输出列分片、concat，以及下游输入行分片产生同形partial后求和；权重采用数学[in,out]约定。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a63a2a"/></marker></defs><rect width="960" height="1069" fill="#fdfcf8"/><g font-family="Segoe UI,Microsoft YaHei,Noto Sans SC,sans-serif"><text x="24" y="38" fill="#1b1b1b" font-size="25" text-anchor="start" font-weight="600">Tensor Parallel：切输出列与切输入行，有什么不同</text><text x="24" y="72" fill="#57534b" font-size="17" text-anchor="start" font-weight="normal">数学权重采用 [in,out]；PyTorch 存储方向相反。本图示例两张逻辑 rank，单卡可手算。</text><text x="42" y="125" fill="#1b1b1b" font-size="20" text-anchor="start" font-weight="600">① 列并行：把数学权重 W [in=4,out=4] 沿输出列切成两份</text><text x="68" y="170" fill="#1b1b1b" font-size="18" text-anchor="start" font-weight="normal">每个 rank 读相同 X [3,4]</text><text x="119.5" y="198" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h0</text><text x="174.5" y="198" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h1</text><text x="229.5" y="198" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h2</text><text x="284.5" y="198" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">h3</text><text x="80" y="236.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t0</text><rect x="92" y="210" width="52" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="118.5" y="236.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="147" y="210" width="52" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="173.5" y="236.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">2</text><rect x="202" y="210" width="52" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="228.5" y="236.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3</text><rect x="257" y="210" width="52" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="283.5" y="236.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">4</text><text x="80" y="276.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t1</text><rect x="92" y="250" width="52" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="118.5" y="276.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">5</text><rect x="147" y="250" width="52" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="173.5" y="276.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">6</text><rect x="202" y="250" width="52" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="228.5" y="276.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">7</text><rect x="257" y="250" width="52" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="283.5" y="276.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">8</text><text x="80" y="316.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t2</text><rect x="92" y="290" width="52" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="118.5" y="316.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">9</text><rect x="147" y="290" width="52" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="173.5" y="316.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">10</text><rect x="202" y="290" width="52" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="228.5" y="316.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">11</text><rect x="257" y="290" width="52" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="283.5" y="316.