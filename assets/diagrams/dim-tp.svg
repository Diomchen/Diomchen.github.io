34" width="65" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="184.0" y="560.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">10</text><text x="340" y="418" fill="#1b1b1b" font-size="18" text-anchor="start" font-weight="normal">Y₁ = XW₁ [3,2]</text><text x="369" y="480.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t0</text><rect x="381" y="454" width="65" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="414.0" y="480.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3</text><rect x="449" y="454" width="65" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="482.0" y="480.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">4</text><text x="369" y="520.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t1</text><rect x="381" y="494" width="65" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="414.0" y="520.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">7</text><rect x="449" y="494" width="65" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="482.0" y="520.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">8</text><text x="369" y="560.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t2</text><rect x="381" y="534" width="65" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="414.0" y="560.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">11</text><rect x="449" y="534" width="65" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="482.0" y="560.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">12</text><text x="596" y="462" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">按列拼接 Y₀、Y₁ → [3,4]。</text><text x="596" y="491" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">每个 token 拿回 4 个输出分量。</text><text x="596" y="52