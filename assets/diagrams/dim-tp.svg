chor="middle" font-weight="normal">0</text><rect x="509" y="800" width="61" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="540.0" y="826.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="573" y="800" width="61" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="604.0" y="826.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">11</text><rect x="637" y="800" width="61" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="668.0" y="826.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">12</text><text x="746" y="747" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">两个 partial</text><text x="746" y="776" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">都是 [3,4]。</text><text x="746" y="805" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">逐元素求和，</text><text x="746" y="834" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">不是再次拼接。</text><rect x="24" y="889" width="912" height="138" rx="6" fill="#f8efda" stroke="#d7d0c4"/><text x="42" y="920" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">concat 和 all-reduce sum 的条件不同</text><text x="42" y="951" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">列并行切数学 W 的列，对应切 PyTorch weight 的行；各 rank 持有不同输出坐标。</text><text x="42" y="980" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">行并行得到同形 [3,4] partial，all-reduce 逐元素相加；它不能替换成 concat。</text><text x="42" y="1009" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">本图只演示普通 Linear；前面 Hkv=1 的 toy 不满足 nano-vllm TP=2 的 KV 头整除约束。</text></g></svg>