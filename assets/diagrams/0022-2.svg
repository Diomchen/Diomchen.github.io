<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 235" role="img" aria-labelledby="title"><title id="title">FlashAttention 的分块视图</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a63a2a"/></marker></defs><rect width="720" height="235" fill="#fff"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="20" y="27" text-anchor="start" font-size="17" fill="#1b1b1b">FlashAttention 的分块视图</text><rect x="20" y="60" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="125" y="89" text-anchor="middle" font-size="12" fill="#a63a2a">01</text><text x="125" y="113" text-anchor="middle" font-size="14" fill="#253d46">载入 Q / K / V tile</text><text x="125" y="134" text-anchor="middle" font-size="14" fill="#253d46">放入片上存储</text><path d="M232 105L251 105" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="255" y="60" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="360" y="89" text-anchor="middle" font-size="12" fill="#a63a2a">02</text><text x="360" y="113" text-anchor="middle" font-size="14" fill="#253d46">更新 m, l, o</text><text x="360" y="134" text-anchor="middle" font-size="14" fill="#253d46">在线归一化累积</text><path d="M467 105L486 105" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="60" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="595" y="89" text-anchor="middle" font-size="12" fill="#a63a2a">03</text><text x="595" y="113" text-anchor="middle" font-size="14" fill="#253d46">遍历下一个 KV tile</text><text x="595" y="134" text-anchor="middle" font-size="14" fill="#253d46">最后输出 o/l</text></g></svg>