<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title"><title id="title">一个二维对子上的 RoPE</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a63a2a"/></marker></defs><rect width="720" height="320" fill="#fff"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="20" y="27" text-anchor="start" font-size="17" fill="#1b1b1b">一个二维对子上的 RoPE</text><circle cx="240" cy="170" r="100" fill="none" stroke="#bdcfd7"/><path d="M240 170L335 140" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><path d="M240 170L275 75" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><text x="352" y="143" text-anchor="middle" font-size="17" fill="#253d46">Q</text><text x="282" y="64" text-anchor="middle" font-size="17" fill="#253d46">K</text><text x="520" y="140" text-anchor="middle" font-size="15" fill="#253d46">Q → R(mθ)Q</text><text x="520" y="178" text-anchor="middle" font-size="15" fill="#253d46">K → R(nθ)K</text><text x="360" y="300" text-anchor="middle" font-size="14" fill="#253d46">二维旋转保持范数；共同平移保持相对角度。</text></g></svg>