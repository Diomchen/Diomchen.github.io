<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1020" role="img" aria-labelledby="title desc"><title id="title">Paged KV：时间位置怎样落到物理缓存格子</title><desc id="desc">T=5、block_size=2、block_table=[3,0,4] 时逐token计算逻辑块、偏移、物理块和slot，并将每个K分量填进物理池的格子。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a63a2a"/></marker></defs><rect width="960" height="1020" fill="#fdfcf8"/><g font-family="Segoe UI,Microsoft YaHei,Noto Sans SC,sans-serif"><text x="24" y="38" fill="#1b1b1b" font-size="25" text-anchor="start" font-weight="600">Paged KV：时间位置怎样落到物理缓存格子</text><text x="24" y="72" fill="#57534b" font-size="17" text-anchor="start" font-weight="normal">只画一层的一份 K；T=5、Hkv=1、d=2。短横线表示未使用，不能当作有效历史。</text><text x="42" y="126" fill="#1b1b1b" font-size="20" text-anchor="start" font-weight="600">① 逻辑 K [T=5,Hkv=1,d=2]</text><text x="136.0" y="159" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">head0,d0</text><text x="224.0" y="159" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">head0,d1</text><text x="80" y="197.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t0</text><rect x="92" y="171" width="85" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="135.0" y="197.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k0a</text><rect x="180" y="171" width="85" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="223.0" y="197.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k0b</text><text x="80" y="237.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t1</text><rect x="92" y="211" width="85" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="135.0" y="237.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k1a</text><rect x="180" y="211" width="85" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="223.0" y="237.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k1b</text><text x="80" y="277.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t2</text><rect x="92" y="251" width="85" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="135.0" y="277.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k2a</text><rect x="180" y="251" width="85" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="223.0" y="277.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k2b</text><text x="80" y="317.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t3</text><rect x="92" y="291" width="85" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="135.0" y="317.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k3a</text><rect x="180" y="291" width="85" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="223.0" y="317.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k3b</text><text x="80" y="357.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">t4</text><rect x="92" y="331" width="85" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="135.0" y="357.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k4a</text><rect x="180" y="331" width="85" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="223.0" y="357.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k4b</text><text x="403" y="126" fill="#1b1b1b" font-size="20" text-anchor="start" font-weight="600">② block_size=2；block_table=[3,0,4]</text><text x="481.5" y="159" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">t</text><text x="572.5" y="159" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">逻辑块</text><text x="663.5" y="159" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">块内偏移</text><text x="754.5" y="159" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">物理块</text><text x="845.5" y="159" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">slot</text><rect x="436" y="171" width="88" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="480.5" y="197.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="527" y="171" width="88" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="571.5" y="197.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="618" y="171" width="88" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="662.5" y="197.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="709" y="171" width="88" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="753.5" y="197.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3</text><rect x="800" y="171" width="88" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="844.5" y="197.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">6</text><rect x="436" y="211" width="88" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="480.5" y="237.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="527" y="211" width="88" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="571.5" y="237.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="618" y="211" width="88" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="662.5" y="237.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">1</text><rect x="709" y="211" width="88" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="753.5" y="237.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">3</text><rect x="800" y="211" width="88" height="37"