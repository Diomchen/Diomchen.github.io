e="17" text-anchor="middle" font-weight="normal">1</text><rect x="436" y="331" width="88" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="480.5" y="357.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">4</text><rect x="527" y="331" width="88" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="571.5" y="357.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">2</text><rect x="618" y="331" width="88" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="662.5" y="357.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">0</text><rect x="709" y="331" width="88" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="753.5" y="357.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">4</text><rect x="800" y="331" width="88" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="844.5" y="357.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">8</text><text x="42" y="431" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">③ 一种便于讲解的 Kcache 布局：[物理块=5,块内位置=2,Hkv=1,d=2]</text><text x="256.0" y="468" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">offset0,d0</text><text x="394.0" y="468" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">offset0,d1</text><text x="532.0" y="468" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">offset1,d0</text><text x="670.0" y="468" fill="#57534b" font-size="16" text-anchor="middle" font-weight="normal">offset1,d1</text><text x="175" y="506.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">块0：slot0/1</text><rect x="187" y="480" width="135" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="255.0" y="506.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k2a</text><rect x="325" y="480" width="135" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="393.0" y="506.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k2b</text><rect x="463" y="480" width="135" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="531.0" y="506.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k3a</text><rect x="601" y="480" width="135" height="37" rx="3" fill="#eaf2ec" stroke="#d7d0c4"/><text x="669.0" y="506.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k3b</text><text x="175" y="546.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">块1：slot2/3</text><rect x="187" y="520" width="135" height="37" rx="3" fill="#eee9e2" stroke="#d7d0c4"/><text x="255.0" y="546.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">—</text><rect x="325" y="520" width="135" height="37" rx="3" fill="#eee9e2" stroke="#d7d0c4"/><text x="393.0" y="546.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">—</text><rect x="463" y="520" width="135" height="37" rx="3" fill="#eee9e2" stroke="#d7d0c4"/><text x="531.0" y="546.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">—</text><rect x="601" y="520" width="135" height="37" rx="3" fill="#eee9e2" stroke="#d7d0c4"/><text x="669.0" y="546.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">—</text><text x="175" y="586.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">块2：slot4/5</text><rect x="187" y="560" width="135" height="37" rx="3" fill="#eee9e2" stroke="#d7d0c4"/><text x="255.0" y="586.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">—</text><rect x="325" y="560" width="135" height="37" rx="3" fill="#eee9e2" stroke="#d7d0c4"/><text x="393.0" y="586.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">—</text><rect x="463" y="560" width="135" height="37" rx="3" fill="#eee9e2" stroke="#d7d0c4"/><text x="531.0" y="586.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">—</text><rect x="601" y="560" width="135" height="37" rx="3" fill="#eee9e2" stroke="#d7d0c4"/><text x="669.0" y="586.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">—</text><text x="175" y="626.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">块3：slot6/7</text><rect x="187" y="600" width="135" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="255.0" y="626.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k0a</text><rect x="325" y="600" width="135" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="393.0" y="626.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k0b</text><rect x="463" y="600" width="135" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="531.0" y="626.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k1a</text><rect x="601" y="600" width="135" height="37" rx="3" fill="#e6eff5" stroke="#d7d0c4"/><text x="669.0" y="626.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k1b</text><text x="175" y="666.0" fill="#57534b" font-size="16" text-anchor="end" font-weight="normal">块4：slot8/9</text><rect x="187" y="640" width="135" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="255.0" y="666.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k4a</text><rect x="325" y="640" width="135" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="393.0" y="666.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">k4b</text><rect x="463" y="640" width="135" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="531.0" y="666.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">—</text><rect x="601" y="640" width="135" height="37" rx="3" fill="#f8efda" stroke="#d7d0c4"/><text x="669.0" y="666.0" fill="#1b1b1b" font-size="17" text-anchor="middle" font-weight="normal">—</text><rect x="24" y="726" width="912" height="109" rx="6" fill="#f8efda" stroke="#d7d0c4"/><text x="42" y="757" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">同一个逻辑元素，被映射到不同的物理位置</text><text x="42" y="788" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">逻辑 K[4,0,1] = k4b → block_table[4//2]=4 → cache[4,0,0,1]。</text><text x="42" y="817" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">slot = block_table[t//2]×2 + t%2；t4 的 slot=8，仍有 head/d 两个内层坐标。</text><rect x="24" y="865" width="912" height="109" rx="6" fill="#eaf2ec" stroke="#d7d0c4"/><text x="42" y="896" fill="#1b1b1b" font-size="19" text-anchor="start" font-weight="600">分页改变存放位置，不改变 attention 的逻辑时间顺序</text><text x="42" y="927" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">逻辑 K 共 5×1×2=10 个有效数；图中物理池预留 5×2×1×2=20 个槽位。</text><text x="42" y="956" fill="#57534b" font-size="18" text-anchor="start" font-weight="normal">V 独立做相同映射；每层还有自己的 K/V。实际 backend 可采用不同轴顺序或额外分块。</text></g></svg>