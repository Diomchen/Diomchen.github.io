<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 365" role="img" aria-labelledby="title"><title id="title">不要把所有耗时塞进一个tok/s</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a63a2a"/></marker></defs><rect width="720" height="365" fill="#fff"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="20" y="27" text-anchor="start" font-size="17" fill="#1b1b1b">不要把所有耗时塞进一个tok/s</text><rect x="20" y="60" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="125" y="89" text-anchor="middle" font-size="12" fill="#a63a2a">01</text><text x="125" y="113" text-anchor="middle" font-size="14" fill="#253d46">排队与前处理</text><text x="125" y="134" text-anchor="middle" font-size="14" fill="#253d46">影响端到端TTFT</text><path d="M232 105L251 105" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="255" y="60" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="360" y="89" text-anchor="middle" font-size="12" fill="#a63a2a">02</text><text x="360" y="113" text-anchor="middle" font-size="14" fill="#253d46">prefill / decode执行</text><text x="360" y="134" text-anchor="middle" font-size="14" fill="#253d46">记录输入与draft量</text><path d="M467 105L486 105" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="60" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="595" y="89" text-anchor="middle" font-size="12" fill="#a63a2a">03</text><text x="595" y="113" text-anchor="middle" font-size="14" fill="#253d46">输出到达客户端</text><text x="595" y="134" text-anchor="middle" font-size="14" fill="#253d46">记录ITL与墙钟</text><path d="M595 150V178H125V199" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="205" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="125" y="234" text-anchor="middle" font-size="12" fill="#a63a2a">04</text><text x="125" y="258" text-anchor="middle" font-size="14" fill="#253d46">warmup / capture</text><text x="125" y="279" text-anchor="middle" font-size="14" fill="#253d46">与稳态分开</text><path d="M232 250L251 250" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="255" y="205" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="360" y="234" text-anchor="middle" font-size="12" fill="#a63a2a">05</text><text x="360" y="258" text-anchor="middle" font-size="14" fill="#253d46">有效输出token</text><text x="360" y="279" text-anchor="middle" font-size="14" fill="#253d46">吞吐分子</text><path d="M467 250L486 250" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="205" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="595" y="234" text-anchor="middle" font-size="12" fill="#a63a2a">06</text><text x="595" y="258" text-anchor="middle" font-size="14" fill="#253d46">配置和负载</text><text x="595" y="279" text-anchor="middle" font-size="14" fill="#253d46">一起保存</text></g></svg>