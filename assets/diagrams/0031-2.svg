<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title"><title id="title">平均负载掩盖最慢rank</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a63a2a"/></marker></defs><rect width="720" height="320" fill="#fff"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="20" y="27" text-anchor="start" font-size="17" fill="#1b1b1b">平均负载掩盖最慢rank</text><text x="350" y="54" text-anchor="middle" font-size="14" fill="#253d46">示意rank负载为[20,8,6,6]</text><text x="95" y="100" text-anchor="middle" font-size="14" fill="#253d46">rank 0</text><rect x="150" y="79" width="400" height="30" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="565" y="101" text-anchor="middle" font-size="14" fill="#a63a2a">20</text><text x="95" y="148" text-anchor="middle" font-size="14" fill="#253d46">rank 1</text><rect x="150" y="127" width="160" height="30" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="325" y="149" text-anchor="middle" font-size="14" fill="#a63a2a">8</text><text x="95" y="196" text-anchor="middle" font-size="14" fill="#253d46">rank 2</text><rect x="150" y="175" width="120" height="30" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="285" y="197" text-anchor="middle" font-size="14" fill="#a63a2a">6</text><text x="95" y="244" text-anchor="middle" font-size="14" fill="#253d46">rank 3</text><rect x="150" y="223" width="120" height="30" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="285" y="245" text-anchor="middle" font-size="14" fill="#a63a2a">6</text><text x="350" y="300" text-anchor="middle" font-size="14" fill="#253d46">总量相同，最忙rank仍决定同步等待。</text></g></svg>