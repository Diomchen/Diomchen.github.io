<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 365" role="img" aria-labelledby="title"><title id="title">两条序列压平，不把序列边界抹掉</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#a63a2a"/></marker></defs><rect width="720" height="365" fill="#fff"/><g font-family="Segoe UI,Microsoft YaHei,sans-serif"><text x="20" y="27" text-anchor="start" font-size="17" fill="#1b1b1b">两条序列压平，不把序列边界抹掉</text><rect x="20" y="60" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="125" y="89" text-anchor="middle" font-size="12" fill="#a63a2a">01</text><text x="125" y="113" text-anchor="middle" font-size="14" fill="#253d46">A 长2，B 长3</text><text x="125" y="134" text-anchor="middle" font-size="14" fill="#253d46">输入共5 token</text><path d="M232 105L251 105" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="255" y="60" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="360" y="89" text-anchor="middle" font-size="12" fill="#a63a2a">02</text><text x="360" y="113" text-anchor="middle" font-size="14" fill="#253d46">input_ids</text><text x="360" y="134" text-anchor="middle" font-size="14" fill="#253d46">[A0,A1,B0,B1,B2]</text><path d="M467 105L486 105" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="490" y="60" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="595" y="89" text-anchor="middle" font-size="12" fill="#a63a2a">03</text><text x="595" y="113" text-anchor="middle" font-size="14" fill="#253d46">cu_seqlens_q</text><text x="595" y="134" text-anchor="middle" font-size="14" fill="#253d46">[0,2,5]</text><path d="M595 150V178H125V199" fill="none" stroke="#a63a2a" stroke-width="2" marker-end="url(#arrow)"/><rect x="20" y="205" width="210" height="90" rx="5" fill="#e9f2f6" stroke="#8aa7b5"/><text x="125" y="234" text-anchor="middle" font-size="12" fill="#a