<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图解索引</title><link rel="stylesheet" href="../assets/course.css?v=2"><link rel="stylesheet" href="../assets/deep-dive.css"><link rel="stylesheet" href="../assets/dimensions.css"></head><body><a class="skip-link" href="#main">跳到正文</a><main class="page" id="main"><nav class="lesson-nav"><a href="../index.html">← 课程首页</a></nav><h1>图解索引</h1><p class="dek">46 张离线 SVG 图。先看元素与坐标，再看完整计算流程。</p><h2>新增：逐格拆解维度转换</h2><p><a href="dimension-walkthrough.html">进入完整维度图解与4组交互实验 →</a></p><figure class="dimension-figure"><div class="diagram-scroll" tabindex="0" role="region" aria-label="Embedding 查表：ID 到向量，窄屏可横向滚动"><img src="../assets/diagrams/dim-embedding.svg" alt="Embedding 查表：ID 到向量。逐行展示 ids=[2,0,4] 如何从 E[6,4] 读取三行，得到 X[1,3,4]；输入索引数量与输出浮点元素数不同，查表不是 reshape。" loading="lazy"></div><figcaption>逐行展示 ids=[2,0,4] 如何从 E[6,4] 读取三行，得到 X[1,3,4]；输入索引数量与输出浮点元素数不同，查表不是 reshape。<a href="../assets/diagrams/dim-embedding.svg" target="_blank" rel="noopener">打开原图放大 ↗</a></figcaption></figure><figure class="dimension-figure"><div class="diagram-scroll" tabindex="0" role="region" aria-label="QKV 投影与不等宽 split，窄屏可横向滚动"><img src="../assets/diagrams/dim-qkv.svg" alt="QKV 投影与不等宽 split。用完整 X[3,4] 和 W[4,8] 计算 Y[3,8]，将 Q 的4列、K的2列、V的2列分别标色，解释收缩轴和 Linear.weight 的转置约定。" loading="lazy"></div><figcaption>用完整 X[3,4] 和 W[4,8] 计算 Y[3,8]，将 Q 的4列、K的2列、V的2列分别标色，解释收缩轴和 Linear.weight 的转置约定。<a href="../assets/diagrams/dim-qkv.svg" target="_blank" rel="noopener">打开原图放大 ↗</a></figcaption></figure><figure class="dimension-figure"><div class="diagram-scroll" tabindex="0" role="region" aria-label="reshape 与 transpose 的元素轨迹，窄屏可横向滚动"><img src="../assets/diagrams/dim-heads.svg" alt="reshape 与 transpose 的元素轨迹。编号0至11由 [1,3,4] 拆成 [1,3,2,2]，再转置为 [1,2,3,2]；逐 head 画出矩阵，并追踪编号2的三套坐标。" loading="lazy"></div><figcaption>编号0至11由 [1,3,4] 拆成 [1,3,2,2]，再转置为 [1,2,3,2]；逐 head 画出矩阵，并追踪编号2的三套坐标。<a href="../assets/diagrams/dim-heads.svg" target="_blank" rel="noopener">打开原图放大 ↗</a></figcaption></figure><figure class="dimension-figure"><div class="diagram-scroll" tabindex="0" role="region" aria-label="QKᵀ 与 AV：保留轴和收缩轴，窄屏可横向滚动"><img src="../assets/diagrams/dim-attention.svg" alt="QKᵀ 与 AV：保留轴和收缩轴。完整展示一个 head 的 Q、K转置、分数、因果softmax、V和输出，区分第一次沿d求和和第二次沿Tk求和，给出可复算数值。" loading="lazy"></div><figcaption>完整展示一个 head 的 Q、K转置、分数、因果softmax、V和输出，区分第一次沿d求和和第二次沿Tk求和，给出可复算数值。<a href="../assets/diagrams/dim-attention.svg" target="_blank" rel="noopener">打开原图放大 ↗</a></figcaption></figure><figure class="dimension-figure"><div class="diagram-scroll" tabindex="0" role="region" aria-label="GQA 的 head 共享与广播，窄屏可横向滚动"><img src="../assets/diagrams/dim-gqa.svg" alt="GQA 的 head 共享与广播。Q的两个 [3,2] 头指向同一个 K/V 头；说明共享的是 K/V，不是注意力权重，也不要求物理复制共享张量。" loading="lazy"></div><figcaption>Q的两个 [3,2] 头指向同一个 K/V 头；说明共享的是 K/V，不是注意力权重，也不要求物理复制共享张量。<a href="../assets/diagrams/dim-gqa.svg" target="_blank" rel="noopener">打开原图放大 ↗</a></figcaption></figure><figure class="dimension-figure"><div class="diagram-scroll" tabindex="0" role="region" aria-label="正确合头与直接 reshape 的反例，窄屏可横向滚动"><img src="../assets/diagrams/dim-merge.svg" alt="正确合头与直接 reshape 的反例。同一组12个编号分别按 transpose后合头与直接reshape排列，直观看见后者把不同 token 的值混到一行。" loading="lazy"></div><figcaption>同一组12个编号分别按 transpose后合头与直接reshape排列，直观看见后者把不同 token 的值混到一行。<a href="../assets/diagrams/dim-merge.svg" target="_blank" rel="noopener">打开原图放大 ↗</a></figcaption></figure><figure class="dimension-figure"><div class="diagram-scroll" tabindex="0" role="region" aria-label="SwiGLU 的 split、门控和 down 投影，窄屏可横向滚动"><img src="../assets/diagrams/dim-mlp.svg" alt="SwiGLU 的 split、门控和 down 投影。放大一个token的12维gate_up，切为两个6维向量，实际计算SiLU与逐元素乘积，再经6×4矩阵投回hidden宽度。" loading="lazy"></div><figcaption>放大一个token的12维gate_up，切为两个6维向量，实际计算SiLU与逐元素乘积，再经6×4矩阵投回hidden宽度。<a href="../assets/diagrams/dim-mlp.svg" target="_blank" rel="noopener">打开原图放大 ↗</a></figcaption></figure><figure class="dimension-figure"><div class="diagram-scroll" tabindex="0" role="region" aria-label="去掉 padding 后的 packed token 轴，窄屏可横向滚动"><img src="../assets/diagrams/dim-packed.svg" alt="去掉 padding 后的 packed token 轴。将长度3和2的两条请求从 padded [2,3,4] 收集到 [5,4]，逐行标出来源，并用 cu_seqlens=[0,3,5] 恢复请求边界。" loading="lazy"></div><figcaption>将长度3和2的两条请求从 padded [2,3,4] 收集到 [5,4]，逐行标出来源，并用 cu_seqlens=[0,3,5] 恢复请求边界。<a href="../assets/diagrams/dim-packed.svg" target="_blank" rel="noopener">打开原图放大 ↗</a></figcaption></figure><figure class="dimension-figure"><div class="diagram-scroll" tabindex="0" role="region" aria-label="逻辑时间轴到分页 KV 物理坐标，窄屏可横向滚动"><img src="../assets/diagrams/dim-paged.svg" alt="逻辑时间轴到分页 KV 物理坐标。T=5、block_size=2、block_table=[3,0,4] 时逐token计算逻辑块、偏移、物理块和slot，并将每个K分量填进物理池的格子。" loading="lazy"></div><figcaption>T=5、block_size=2、block_table=[3,0,4] 时逐token计算逻辑块、偏移、物理块和slot，并将每个K分量填进物理池的格子。<a href="../assets/diagrams/dim-paged.svg" target="_blank" rel="noopener">打开原图放大 ↗</a></figcaption></figure><figure class="dimension-figure"><div class="diagram-scroll" tabindex="0" role="region" aria-label="列并行 concat 与行并行 sum，窄屏可横向滚动"><img src="../assets/diagrams/dim-tp.svg" alt="列并行 concat 与行并行 sum。用完整小矩阵展示输入复制、输出列分片、concat，以及下游输入行分片产生同形partial后求和；权重采用数学[in,out]约定。" loading="lazy"></div><figcaption>用完整小矩阵展示输入复制、输出列分片、concat，以及下游输入行分片产生同形partial后求和；权重采用数学[in,out]约定。<a href="../assets/diagrams/dim-tp.svg" target="_blank" rel="noopener">打开原图放大 ↗</a></figcaption></figure><h2>课程概览图</h2><div class="atlas-grid"><figure class="visual"><a href="../lessons/0015-transformer-tensor-contract.html"><img src="../assets/diagrams/0015-1.svg" alt="token 到 logits 的六个检查点" loading="lazy"></a><figcaption>15 · token 到 logits 的六个检查点。这是概念形状；框架常将变长 batch 压平为 [总 token 数,H]。</figcaption></figure><figure class="visual"><a href="../lessons/0015-transformer-tensor-contract.html"><img src="../assets/diagrams/0015-2.svg" alt="Qwen3-0.6B 的投影宽度" loading="lazy"></a><figcaption>15 · Qwen3-0.6B 的投影宽度。数值来自模型 config 与 nano-vllm 的 Qwen3Attention；不使用 H/Hq 猜 head_dim。</figcaption></figure><figure class="visual"><a href="../lessons/0016-attention-by-hand.html"><img src="../assets/diagrams/0016-1.svg" alt="Attention 的三步，不要跳过中间量" loading="lazy"></a><figcaption>16 · Attention 的三步，不要跳过中间量。Q/K 决定如何分配权重，V 提供要汇总的内容。</figcaption></figure><figure class="visual"><a href="../lessons/0016-attention-by-hand.html"><img src="../assets/diagrams/0016-2.svg" alt="每个 query 有自己的一行概率" loading="lazy"></a><figcaption>16 · 每个 query 有自己的一行概率。矩阵展示因果可见性，不是已经算出的概率。</figcaption></figure><figure class="visual"><a href="../lessons/0017-causal-mask-and-generation.html"><img src="../assets/diagrams/0017-1.svg" alt="完整序列的因果遮罩" loading="lazy"></a><figcaption>17 · 完整序列的因果遮罩。上三角被屏蔽；对角线保留，因为当前位置用于预测下一 token。</figcaption></figure><figure class="visual"><a href="../lessons/0017-causal-mask-and-generation.html"><img src="../assets/diagrams/0017-2.svg" alt="缓存 chunk 必须带上位置偏移" loading="lazy"></a><figcaption>17 · 缓存 chunk 必须带上位置偏移。[2,5] 的非方阵 mask 不能直接照搬从左上角开始的 tril。</figcaption></figure><figure class="visual"><a href="../lessons/0018-multihead-gqa.html"><img src="../assets/diagrams/0018-1.svg" alt="4 个 Q 头，2 组 K/V" loading="lazy"></a><figcaption>18 · 4 个 Q 头，2 组 K/V。图是逻辑关系，kernel 不必真的把缓存 repeat 成4份。</figcaption></figure><figure class="visual"><a href="../lessons/0018-multihead-gqa.html"><img src="../assets/diagrams/0018-2.svg" alt="三种配置保持 Q 头数为 8" loading="lazy"></a><figcaption>18 · 三种配置保持 Q 头数为 8。固定 L、d、T、dtype 时，KV 容量之比为8:2:1。</figcaption></figure><figure class="visual"><a href="../lessons/0019-rope-position.html"><img src="../assets/diagrams/0019-1.svg" alt="一个二维对子上的 RoPE" loading="lazy"></a><figcaption>19 · 一个二维对子上的 RoPE。只展示一个频率对子；真实 head 有 d/2 个不同频率。</figcaption></figure><figure class="visual"><a href="../lessons/0019-rope-position.html"><img src="../assets/diagrams/0019-2.svg" alt="nano-vllm 的实际执行顺序" loading="lazy"></a><figcaption>19 · nano-vllm 的实际执行顺序。本地实现对 Q/K 旋转，不对 V 做这一步旋转。</figcaption></figure><figure class="visual"><a href="../lessons/0020-norm-residual-swiglu.html"><img src="../assets/diagrams/0020-1.svg" alt="Pre-Norm attention 子层" loading="lazy"></a><figcaption>20 · Pre-Norm attention 子层。公式是逻辑视图；内核融合可以延迟加法但要保持相同数据流。</figcaption></figure><figure class="visual"><a href="../lessons/0020-norm-residual-swiglu.html"><img src="../assets/diagrams/0020-2.svg" alt="SwiGLU 的两条投影支路" loading="lazy"></a><figcaption>20 · SwiGLU 的两条投影支路。逐 token 的通道变换；FFN 自身不沿 token 维混合信息。</figcaption></figure><figure class="visual"><a href="../lessons/0021-kv-cache-equivalence.html"><img src="../assets/diagrams/0021-1.svg" alt="缓存沿 token 轴增长" loading="lazy"></a><figcaption>21 · 缓存沿 token 轴增长。示意有效前缀增长；不是多个 decoder 层共用同一份 K/V。</figcaption></figure><figure class="visual"><a href="../lessons/0021-kv-cache-equivalence.html"><img src="../assets/diagrams/0021-2.svg" alt="一个 decode step 真正做的工作" loading="lazy"></a><figcaption>21 · 一个 decode step 真正做的工作。最后刚采样的 token 已存在于 token_ids，但还没有自己的 KV。</figcaption></figure><figure class="visual"><a href="../lessons/0022-flashattention-online-softmax.html"><img src="../assets/diagrams/0022-1.svg" alt="朴素 attention 的中间矩阵" loading="lazy"></a><figcaption>22 · 朴素 attention 的中间矩阵。大中间矩阵在 HBM 中往返；这张图是朴素物化方案。</figcaption></figure><figure class="visual"><a href="../lessons/0022-flashattention-online-softmax.html"><img src="../assets/diagrams/0022-2.svg" alt="FlashAttention 的分块视图" loading="lazy"></a><figcaption>22 · FlashAttention 的分块视图。算法避免物化完整分数/概率矩阵；dense attention 的算术规模仍是二次。</figcaption></figure><figure class="visual"><a href="../lessons/0023-logits-sampling.html"><img src="../assets/diagrams/0023-1.svg" alt="生成采样的概念路径" loading="lazy"></a><figcaption>23 · 生成采样的概念路径。top-k/top-p 是概念扩展；当前 nano-vllm 只实现 temperature 采样。</figcaption></figure><figure class="visual"><a href="../lessons/0023-logits-sampling.html"><img src="../assets/diagrams/0023-2.svg" alt="本地 sampler 的指数竞赛" loading="lazy"></a><figcaption>23 · 本地 sampler 的指数竞赛。等价理解为 argmin(e/p) 的指数竞赛；不等于 argmax(p)。</figcaption></figure><figure class="visual"><a href="../lessons/0024-nano-state-trace.html"><img src="../assets/diagrams/0024-1.svg" alt="同一请求每轮经过相同的控制环" loading="lazy"></a><figcaption>24 · 同一请求每轮经过相同的控制环。chunk 未完成时虽然 runner 返回候选，postprocess 不追加它。</figcaption></figure><figure class="visual"><a href="../lessons/0024-nano-state-trace.html"><img src="../assets/diagrams/0024-2.svg" alt="不要混淆三种“进度”" loading="lazy"></a><figcaption>24 · 不要混淆三种“进度”。真实数值见正文表；红线不是生成边界，计数器才是契约。</figcaption></figure><figure class="visual"><a href="../lessons/0025-nano-memory-lifecycle.html"><img src="../assets/diagrams/0025-1.svg" alt="离散物理块承载连续逻辑序列" loading="lazy"></a><figcaption>25 · 离散物理块承载连续逻辑序列。教学使用小块；实际默认块大小以config为准。</figcaption></figure><figure class="visual"><a href="../lessons/0025-nano-memory-lifecycle.html"><img src="../assets/diagrams/0025-2.svg" alt="同一个物理块可经历的六个时刻" loading="lazy"></a><figcaption>25 · 同一个物理块可经历的六个时刻。free 是可回收状态，不保证内容已经清零；仍可能命中缓存。</figcaption></figure><figure class="visual"><a href="../lessons/0026-nano-runner-graph.html"><img src="../assets/diagrams/0026-1.svg" alt="两条序列压平，不把序列边界抹掉" loading="lazy"></a><figcaption>26 · 两条序列压平，不把序列边界抹掉。这是无缓存prefill；命中prefix后query长度与key长度不同。</figcaption></figure><figure class="visual"><a href="../lessons/0026-nano-runner-graph.html"><img src="../assets/diagrams/0026-2.svg" alt="graph replay 使用预分配缓冲区" loading="lazy"></a><figcaption>26 · graph replay 使用预分配缓冲区。数据值与有效长度可变；捕获图的形状/地址合约必须满足。</figcaption></figure><figure class="visual"><a href="../lessons/0027-vllm-token-ledger.html"><img src="../assets/diagrams/0027-1.svg" alt="EngineCore 闭环与跨层契约" loading="lazy"></a><figcaption>27 · EngineCore 闭环与跨层契约。普通step仍会等待结果；non_block=True本身不等于下一轮已重叠执行。</figcaption></figure><figure class="visual"><a href="../lessons/0027-vllm-token-ledger.html"><img src="../assets/diagrams/0027-2.svg" alt="三个边界分开看" loading="lazy"></a><figcaption>27 · 三个边界分开看。异步与投机令三条进度暂时不同，输出返回后必须对账。</figcaption></figure><figure class="visual"><a href="../lessons/0028-vllm-prefix-block-pool.html"><img src="../assets/diagrams/0028-1.svg" alt="缓存身份需要比token子串更多信息" loading="lazy"></a><figcaption>28 · 缓存身份需要比token子串更多信息。不同身份的请求不能仅因token子串相同就共享缓存。</figcaption></figure><figure class="visual"><a href="../lessons/0028-vllm-prefix-block-pool.html"><img src="../assets/diagrams/0028-2.svg" alt="最后一个token的logits边界" loading="lazy"></a><figcaption>28 · 最后一个token的logits边界。图的槽位采用B=4示意寻址；32-token例子的B=16见正文。</figcaption></figure><figure class="visual"><a href="../lessons/0029-vllm-runner-and-measurement.html"><img src="../assets/diagrams/0029-1.svg" alt="调度计划被翻译成执行元数据" loading="lazy"></a><figcaption>29 · 调度计划被翻译成执行元数据。假设无CP、无spec、单标准KV group；总输入6个，但候选输出最多3个。</figcaption></figure><figure class="visual"><a href="../lessons/0029-vllm-runner-and-measurement.html"><img src="../assets/diagrams/0029-2.svg" alt="不要把所有耗时塞进一个tok/s" loading="lazy"></a><figcaption>29 · 不要把所有耗时塞进一个tok/s。图只给测量口径，不提供任何未实测吞吐数字。</figcaption></figure><figure class="visual"><a href="../lessons/0030-deepinfer-runtime-boundary.html"><img src="../assets/diagrams/0030-1.svg" alt="请求从Python进入C++的路径" loading="lazy"></a><figcaption>30 · 请求从Python进入C++的路径。公开版本仍有prompt/decode阶段选择，不照搬vLLM的所有抽象。</figcaption></figure><figure class="visual"><a href="../lessons/0030-deepinfer-runtime-boundary.html"><img src="../assets/diagrams/0030-2.svg" alt="公开README划出的系统边界" loading="lazy"></a><figcaption>30 · 公开README划出的系统边界。缺完整KV服务不等于没有本地KV缓存；支持矩阵以固定提交README为准。</figcaption></figure><figure class="visual"><a href="../lessons/0031-deepinfer-moe-placement.html"><img src="../assets/diagrams/0031-1.svg" alt="非MegaMoE路径的数据往返" loading="lazy"></a><figcaption>31 · 非MegaMoE路径的数据往返。handle保存通信/排列上下文；不是把所有专家输出按物理顺序直接拼接。</figcaption></figure><figure class="visual"><a href="../lessons/0031-deepinfer-moe-placement.html"><img src="../assets/diagrams/0031-2.svg" alt="平均负载掩盖最慢rank" loading="lazy"></a><figcaption>31 · 平均负载掩盖最慢rank。这是解释热点的示意数据，非实际benchmark；EPLB策略还看多步历史和槽位容量。</figcaption></figure><figure class="visual"><a href="../lessons/0032-deepinfer-dspark-state.html"><img src="../assets/diagrams/0032-1.svg" alt="置信度决定验证工作量，不直接决定接受" loading="lazy"></a><figcaption>32 · 置信度决定验证工作量，不直接决定接受。预测接受率与真正接受/拒绝是不同步骤。</figcaption></figure><figure class="visual"><a href="../lessons/0032-deepinfer-dspark-state.html"><img src="../assets/diagrams/0032-2.svg" alt="确定性需要一组前提" loading="lazy"></a><figcaption>32 · 确定性需要一组前提。该固定提交的配置配方，不代表跨硬件和跨版本无条件逐位一致。</figcaption></figure></div></main><script src="../assets/quiz.js"></script><script src="../assets/explorers.js"></script><script src="../assets/highlight.js?v=2"></script><script src="../assets/lesson-ui.js?v=2"></script></body></html>
